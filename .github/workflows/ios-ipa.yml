name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Signing Export Method (when Apple certs are configured in Secrets)'
        required: false
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - app-store
          - enterprise
          - development

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build iOS IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform Shared Framework for iOS (Arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: iosApp
        run: xcodegen generate

      - name: Check for Apple Signing Secrets
        id: check_signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CERT_B64" && -n "$PROFILE_B64" && -n "$TEAM_ID" ]]; then
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Apple signing credentials detected — will build SIGNED .ipa"
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "No Apple signing secrets found — will build UNSIGNED .ipa for sideloading"
          fi

      - name: Import Code-Signing Certificates and Provisioning Profile
        if: steps.check_signing.outputs.signed == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          echo "PROVISION_UUID=$UUID" >> $GITHUB_ENV
          echo "PROVISION_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Build & Export SIGNED iOS IPA
        if: steps.check_signing.outputs.signed == 'true'
        working-directory: iosApp
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
        run: |
          xcodebuild archive \
            -project ZimbaBeats.xcodeproj \
            -scheme ZimbaBeats \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ZimbaBeats.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISION_NAME"

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.zimbabeats.ios</key>
                  <string>${PROVISION_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ZimbaBeats.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

          cp build/export/*.ipa ../ZimbaBeats.ipa

      - name: Build & Package UNSIGNED iOS IPA (Fallback when no certs configured)
        if: steps.check_signing.outputs.signed != 'true'
        working-directory: iosApp
        run: |
          xcodebuild \
            -project ZimbaBeats.xcodeproj \
            -scheme ZimbaBeats \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ZimbaBeats.app Payload/
          zip -r ../ZimbaBeats.ipa Payload

      - name: Upload ZimbaBeats.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZimbaBeats-iOS-IPA
          path: ZimbaBeats.ipa

      - name: Attach IPA to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          gh release upload "$VERSION" ZimbaBeats.ipa --clobber || true
