name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build iOS IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform Shared Framework for iOS (Arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS App Bundle (Unsigned Release for Device)
        working-directory: iosApp
        run: |
          xcodebuild \
            -project ZimbaBeats.xcodeproj \
            -scheme ZimbaBeats \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .app into ZimbaBeats.ipa
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ZimbaBeats.app Payload/
          zip -r ../ZimbaBeats.ipa Payload

      - name: Upload ZimbaBeats.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZimbaBeats-iOS-IPA
          path: ZimbaBeats.ipa

      - name: Attach IPA to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          gh release upload "$VERSION" ZimbaBeats.ipa --clobber || true
